[project]
name = "issue2patch"
version = "0.0.1"
description = "An issue-to-patch agent pipeline: deterministic orchestration, agent nodes via an off-the-shelf harness."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "aiohttp>=3.10",
    "swebench==4.1.0",
    "datasets>=2.20",
    "ruff==0.14.5",
    "psycopg[binary]>=3.2",
    "pika>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
i2p = "issue2patch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue2patch"]
